[project]
name = "imdb-notebooks"
version = "0.1.0"
description = "Kaggle notebooks for the IMDb Movies by Year dataset: the extraction guide and the cleaning notebook."
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=2.0",
    "matplotlib>=3.10",
    "seaborn>=0.13.2",
    "pyarrow>=17.0",
    "langid>=1.1.6",
    "ftfy>=6.3",
    "unidecode>=1.3",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "ipykernel>=6.29",
    # The notebooks install their libraries with %pip, and uv environments ship without pip.
    "pip>=24.0",
]

[tool.uv]
package = false
